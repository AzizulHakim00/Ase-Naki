services:
  - type: web
    name: ase-naki
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: APP_ADMIN_PASSWORD
        generateValue: true
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: MONITORING_REFRESH_SECRET
        generateValue: true
