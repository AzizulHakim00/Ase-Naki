services:
  - type: web
    name: ase-naki
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ase-naki-db
          property: connectionString
      - key: APP_ADMIN_PASSWORD
        generateValue: true

databases:
  - name: ase-naki-db
    plan: free
    databaseName: asenaki
    user: ase_naki_user
