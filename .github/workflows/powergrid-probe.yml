name: Power Grid connectivity probe

on:
  push:
    branches:
      - diagnostic/powergrid-connectivity
    paths:
      - ".github/workflows/powergrid-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch missing intermediate certificate
        shell: bash
        run: |
          set -e
          curl -L --fail --show-error --silent \
            "http://crt.sectigo.com/SSL2BUYEMEARSADomainValidationSecureServerCA.crt" \
            -o /tmp/intermediate.crt
          echo "=== intermediate certificate details ==="
          openssl x509 -inform DER -in /tmp/intermediate.crt \
            -noout -subject -issuer -dates -fingerprint -sha256
          echo "=== PEM ==="
          openssl x509 -inform DER -in /tmp/intermediate.crt -outform PEM
