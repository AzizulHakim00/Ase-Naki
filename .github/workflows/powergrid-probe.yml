name: Power Grid connectivity probe

on:
  push:
    branches:
      - diagnostic/powergrid-connectivity
    paths:
      - ".github/workflows/powergrid-probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Power Grid endpoints
        shell: bash
        run: |
          set +e
          HTTPS_URL="https://erp.powergrid.gov.bd/web/generations/view_demand_supply_loadshed"
          HTTP_URL="http://erp.powergrid.gov.bd/web/generations/view_demand_supply_loadshed"

          echo "=== verified HTTPS ==="
          curl -L --connect-timeout 10 --max-time 30 \
            -A "Mozilla/5.0 Ase-Naki-Monitor/1.0" \
            -o /tmp/verified.html \
            -w "HTTP=%{http_code} TIME=%{time_total}s BYTES=%{size_download}\n" \
            "$HTTPS_URL"
          echo "verified_exit=$?"

          echo "=== insecure HTTPS diagnostic only ==="
          curl -k -L --connect-timeout 10 --max-time 45 \
            --retry 2 --retry-delay 3 \
            -A "Mozilla/5.0 Ase-Naki-Monitor/1.0" \
            -o /tmp/insecure.html \
            -w "HTTP=%{http_code} TIME=%{time_total}s BYTES=%{size_download}\n" \
            "$HTTPS_URL"
          insecure_code=$?
          echo "insecure_exit=$insecure_code"
          if [ "$insecure_code" -eq 0 ]; then
            grep -o "05-09-2026" /tmp/insecure.html | head -1 || true
            wc -c /tmp/insecure.html
          fi

          echo "=== plain HTTP without redirects ==="
          curl --connect-timeout 10 --max-time 20 \
            -A "Mozilla/5.0 Ase-Naki-Monitor/1.0" \
            -D /tmp/http.headers -o /tmp/http.body \
            -w "HTTP=%{http_code} TIME=%{time_total}s BYTES=%{size_download}\n" \
            "$HTTP_URL"
          echo "http_exit=$?"
          head -20 /tmp/http.headers || true
          exit 0
