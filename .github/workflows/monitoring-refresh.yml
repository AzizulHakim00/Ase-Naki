name: Refresh monitoring data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monitoring refresh
        run: |
          curl --fail --show-error --silent \
            --retry 2 --retry-delay 10 \
            -X POST "https://ase-naki-x5ie.onrender.com/internal/monitoring/refresh"
