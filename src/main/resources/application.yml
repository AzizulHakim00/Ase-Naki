spring:
  application:
    name: ase-naki
  datasource:
    url: jdbc:h2:file:./data/asenaki-simple;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  thymeleaf:
    cache: false
server:
  port: ${PORT:8080}
  error:
    include-message: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  admin:
    password: ${APP_ADMIN_PASSWORD:Admin123!}
  monitoring:
    power-grid-url: https://erp.powergrid.gov.bd/web/generations/view_demand_supply_loadshed?page=1
    ioda-url: https://api.ioda.inetintel.cc.gatech.edu/v2/outages/alerts
    cloudflare-url: https://api.cloudflare.com/client/v4/radar/annotations/outages
    cloudflare-token: ${CLOUDFLARE_API_TOKEN:}
    refresh-secret: ${MONITORING_REFRESH_SECRET:}
