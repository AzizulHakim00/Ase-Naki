<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="navbar" class="site-header">
    <nav class="container nav-wrap">
        <a class="brand" th:href="@{/}">
            <img th:src="@{/images/app-icon.png}" alt="Ase Naki icon">
            <span>
                <strong>Ase Naki?</strong>
                <small>Community utility updates</small>
            </span>
        </a>

        <div class="nav-links">
            <a th:href="@{/}"><i class="bi bi-house-door"></i> Home</a>

            <div sec:authorize="isAnonymous()" class="nav-actions">
                <a th:href="@{/login}">Sign in</a>
                <a class="btn btn-brand btn-sm" th:href="@{/register}">Register</a>
            </div>

            <div sec:authorize="isAuthenticated()" class="nav-actions">
                <a class="btn btn-brand btn-sm" th:href="@{/reports/add}">
                    <i class="bi bi-plus-circle"></i> Add report
                </a>
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-secondary btn-sm" type="submit">
                        Sign out
                    </button>
                </form>
            </div>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="site-footer">
    <div class="container">
        <p class="mb-1"><strong>Ase Naki?</strong> — simple utility updates for Bangladesh.</p>
        <small>Do not upload private documents or recognisable faces.</small>
    </div>
</footer>

</body>
</html>
