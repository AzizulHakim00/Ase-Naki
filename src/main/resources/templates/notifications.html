<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Alerts ? Ase Naki?</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-shell">
    <div class="container medium-container">
        <div class="page-heading heading-row">
            <div>
                <span class="eyebrow eyebrow-dark">Your community watch</span>
                <h1>Alerts</h1>
                <p>Reports from places you saved.</p>
            </div>
            <form th:if="${!#lists.isEmpty(notifications)}"
                  th:action="@{/notifications/read-all}" method="post">
                <button class="btn btn-soft" type="submit">Mark all read</button>
            </form>
        </div>

        <div class="empty-state panel" th:if="${#lists.isEmpty(notifications)}">
            <span>?</span>
            <h3>You are all caught up</h3>
            <p>Save a location and new reports there will appear here.</p>
        </div>

        <div class="list-stack" th:unless="${#lists.isEmpty(notifications)}">
            <a class="panel notification-row"
               th:each="notification : ${notifications}"
               th:classappend="${!notification.readByUser ? 'unread' : ''}"
               th:href="@{/reports/view/{id}(id=${notification.report.id})}">
                <span class="notification-dot"></span>
                <div>
                    <strong th:text="${notification.message}">New report</strong>
                    <p th:text="${notification.report.area.displayName}">Mirpur 10</p>
                </div>
                <span aria-hidden="true">?</span>
            </a>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
