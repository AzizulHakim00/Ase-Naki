<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Ase Naki?</title>
    <link rel="icon" type="image/png" th:href="@{/images/app-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container form-page">
    <div class="form-card">
        <div class="form-title">
            <img th:src="@{/images/app-icon.png}" alt="Ase Naki icon">
            <div>
                <span class="eyebrow">Member access</span>
                <h1>Sign in</h1>
            </div>
        </div>

        <div th:if="${param.error}" class="alert alert-danger">
            Email or password was not correct.
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            Registration completed. You can sign in now.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input class="form-control" id="email" name="email"
                       type="email" placeholder="you@example.com" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password"
                       type="password" placeholder="Your password" required>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" id="remember-me"
                       name="remember-me" type="checkbox">
                <label class="form-check-label" for="remember-me">Keep me signed in</label>
            </div>

            <button class="btn btn-brand w-100" type="submit">Sign in</button>
        </form>

        <div class="demo-box">
            <strong>Demo account</strong>
            <span>demo@asenaki.bd</span>
            <span>Demo123!</span>
        </div>

        <p class="text-center mt-4 mb-0">
            New here? <a th:href="@{/register}">Create an account</a>
        </p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
