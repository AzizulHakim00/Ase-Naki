<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved places ? Ase Naki?</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="page-shell">
    <div class="container medium-container">
        <div class="page-heading">
            <span class="eyebrow eyebrow-dark">Your watchlist</span>
            <h1>Saved places</h1>
            <p>New utility reports in these areas will appear in your alerts.</p>
        </div>

        <div class="empty-state panel" th:if="${#lists.isEmpty(savedLocations)}">
            <span>?</span>
            <h3>No saved location yet</h3>
            <p>Open a live report and save its area to receive community alerts.</p>
            <a class="btn btn-primary" th:href="@{/}">Browse live reports</a>
        </div>

        <div class="list-stack" th:unless="${#lists.isEmpty(savedLocations)}">
            <article class="panel saved-row" th:each="saved : ${savedLocations}">
                <div class="location-pin">?</div>
                <div>
                    <h2 th:text="${saved.area.name}">Mirpur 10</h2>
                    <p th:text="${saved.area.thana.name + ', ' + saved.area.thana.district.name}">
                        Mirpur, Dhaka
                    </p>
                </div>
                <a class="btn btn-soft"
                   th:href="@{/(areaId=${saved.area.id})}">View updates</a>
                <form th:action="@{/saved-locations/toggle/{id}(id=${saved.area.id})}"
                      method="post">
                    <button class="btn btn-danger-soft" type="submit">Remove</button>
                </form>
            </article>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
