<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report details | Ase Naki?</title>
    <link rel="icon" type="image/webp" th:href="@{/images/app-icon.webp}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container details-page">
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <a class="back-link" th:href="@{/}"><i class="bi bi-arrow-left"></i> Back to reports</a>

    <article class="details-card">
        <div class="details-heading">
            <div class="utility-icon utility-icon-large">
                <i th:class="${'bi ' + report.utilityType.iconClass}"></i>
            </div>
            <div>
                <p class="utility-name" th:text="${report.utilityType.label}"></p>
                <h1 th:text="${report.area.name}"></h1>
                <p class="text-secondary mb-0" th:text="${report.area.district}"></p>
            </div>
            <span class="status-pill ms-auto"
                  th:classappend="${report.status.cssClass}"
                  th:text="${report.status.label}"></span>
        </div>

        <hr>
        <h2>What was reported</h2>
        <p class="details-description" th:text="${report.description}"></p>

        <div class="details-meta">
            <span><i class="bi bi-person-circle"></i> <span th:text="${report.reporter.name}"></span></span>
            <span><i class="bi bi-calendar3"></i> <span th:text="${#temporals.format(report.reportedAt, 'dd MMM yyyy, hh:mm a')}"></span></span>
        </div>

        <div th:if="${report.hasEvidence()}" class="evidence-section">
            <h2>Evidence image</h2>
            <div class="evidence-grid">
                <a th:each="file : ${report.evidenceFiles}"
                   th:href="@{/evidence/{id}(id=${file.id})}" target="_blank">
                    <img th:src="@{/evidence/{id}(id=${file.id})}"
                         th:alt="${file.fileName}">
                </a>
            </div>
        </div>
    </article>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
