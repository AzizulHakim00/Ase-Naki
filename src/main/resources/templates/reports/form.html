<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${editMode ? 'Edit report | Ase Naki?' : 'Add report | Ase Naki?'}">Report | Ase Naki?</title>
    <link rel="icon" type="image/webp" th:href="@{/images/app-icon.webp}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container form-page">
    <a class="back-link" th:href="@{/}"><i class="bi bi-arrow-left"></i> Back to reports</a>
    <div class="form-card form-card-wide">
        <div class="form-title">
            <div class="form-icon"><i class="bi bi-clipboard-plus"></i></div>
            <div>
                <span class="eyebrow">Community utility update</span>
                <h1 th:text="${editMode ? 'Edit utility report' : 'Add utility report'}">Add utility report</h1>
            </div>
        </div>

        <form th:action="${editMode} ? @{/reports/{id}/edit(id=${reportId})} : @{/reports/add}"
              th:object="${form}" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="areaSearch">Find your area</label>
                    <div class="area-search">
                        <i class="bi bi-search"></i>
                        <input class="form-control" id="areaSearch" type="search"
                               placeholder="Type Mirpur, Uttara, Badda..."
                               autocomplete="off" aria-controls="areaId">
                    </div>
                    <select class="form-select" id="areaId" th:field="*{areaId}"
                            aria-label="Choose an area">
                        <option value="">Choose an area</option>
                        <option th:each="area : ${areas}" th:value="${area.id}"
                                th:text="${area.displayName}"></option>
                    </select>
                    <small class="form-help" id="areaSearchHelp">
                        <span th:text="${areas.size()}">0</span> supported areas
                    </small>
                    <div class="field-error" th:errors="*{areaId}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="utilityType">Utility</label>
                    <select class="form-select" id="utilityType" th:field="*{utilityType}">
                        <option value="">Choose a utility</option>
                        <option th:each="utility : ${utilities}"
                                th:value="${utility}" th:text="${utility.label}"></option>
                    </select>
                    <div class="field-error" th:errors="*{utilityType}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="status">Current status</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option value="">Choose a status</option>
                        <option th:each="item : ${statuses}"
                                th:value="${item}" th:text="${item.label}"></option>
                    </select>
                    <div class="field-error" th:errors="*{status}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" rows="4"
                              th:field="*{description}"
                              placeholder="Example: Electricity has been unavailable for 20 minutes."></textarea>
                    <div class="field-error" th:errors="*{description}"></div>
                </div>
            </div>

            <div class="alert alert-info mt-3 mb-0">
                Image upload is intentionally disabled in this MongoDB CRUD version and can be added later.
            </div>

            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-brand" type="submit">
                    <i class="bi bi-save"></i>
                    <span th:text="${editMode ? 'Update report' : 'Save report'}">Save report</span>
                </button>
                <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    const areaSearch = document.getElementById("areaSearch");
    const areaSelect = document.getElementById("areaId");
    const areaHelp = document.getElementById("areaSearchHelp");
    const areaOptions = Array.from(areaSelect.options).slice(1);

    areaSearch.addEventListener("input", function () {
        const searchText = areaSearch.value.toLowerCase().trim();
        let visibleAreas = 0;

        for (const option of areaOptions) {
            const matches = option.text.toLowerCase().includes(searchText);
            option.hidden = !matches;
            if (matches) {
                visibleAreas++;
            }
        }
        areaHelp.textContent = visibleAreas + " matching areas";
    });
</script>
</body>
</html>
