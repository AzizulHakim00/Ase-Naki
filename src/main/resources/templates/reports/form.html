<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add report | Ase Naki?</title>
    <link rel="icon" type="image/png" th:href="@{/images/app-icon.png}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container form-page">
    <div class="form-card form-card-wide">
        <div class="form-title">
            <div class="form-icon"><i class="bi bi-clipboard-plus"></i></div>
            <div>
                <span class="eyebrow">Quick community update</span>
                <h1>Add utility report</h1>
            </div>
        </div>

        <form th:action="@{/reports/add}" th:object="${form}"
              method="post" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="areaId">Area</label>
                    <select class="form-select" id="areaId" th:field="*{areaId}">
                        <option value="">Choose an area</option>
                        <option th:each="area : ${areas}" th:value="${area.id}"
                                th:text="${area.displayName}"></option>
                    </select>
                    <div class="field-error" th:errors="*{areaId}"></div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="utilityType">Utility</label>
                    <select class="form-select" id="utilityType" th:field="*{utilityType}">
                        <option value="">Choose a utility</option>
                        <option th:each="utility : ${utilities}"
                                th:value="${utility}" th:text="${utility.label}"></option>
                    </select>
                    <div class="field-error" th:errors="*{utilityType}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="status">Current status</label>
                    <select class="form-select" id="status" th:field="*{status}">
                        <option value="">Choose a status</option>
                        <option th:each="item : ${statuses}"
                                th:value="${item}" th:text="${item.label}"></option>
                    </select>
                    <div class="field-error" th:errors="*{status}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="description">Description</label>
                    <textarea class="form-control" id="description" rows="4"
                              th:field="*{description}"
                              placeholder="Example: Electricity has been unavailable for 20 minutes."></textarea>
                    <div class="field-error" th:errors="*{description}"></div>
                </div>

                <div class="col-12">
                    <label class="form-label" for="evidence">Evidence image (optional)</label>
                    <input class="form-control" id="evidence" type="file"
                           th:field="*{evidence}" accept="image/jpeg,image/png,image/webp">
                    <div class="form-text">JPG, PNG or WebP. Maximum 5 MB.</div>
                    <div class="field-error" th:errors="*{evidence}"></div>
                </div>
            </div>

            <div class="d-flex gap-2 mt-4">
                <button class="btn btn-brand" type="submit">
                    <i class="bi bi-save"></i> Save report
                </button>
                <a class="btn btn-outline-secondary" th:href="@{/}">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
