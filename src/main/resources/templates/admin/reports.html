<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Report moderation ? Ase Naki?</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>
<main class="page-shell">
    <div class="container admin-container">
        <div class="page-heading heading-row">
            <div>
                <span class="eyebrow eyebrow-dark">Protected workspace</span>
                <h1>Report moderation</h1>
                <p>Every change creates a permanent audit record.</p>
            </div>
            <a class="btn btn-soft" th:href="@{/admin/audit-logs}">View audit log</a>
        </div>

        <div class="table-shell panel">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Report</th>
                    <th>Reporter</th>
                    <th>Status</th>
                    <th>Confidence</th>
                    <th>Moderation action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reports}">
                    <td>
                        <a th:href="@{/reports/view/{id}(id=${report.id})}">
                            <strong th:text="${report.utilityType.name + ' ? ' + report.area.name}">
                                Electricity ? Mirpur
                            </strong>
                        </a>
                        <small th:text="${report.description ?: 'No description'}">Details</small>
                    </td>
                    <td>
                        <strong th:text="${report.reporter.profile.fullName}">User</strong>
                        <small th:text="${report.reporter.email}">email</small>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="${report.status.cssClass}"
                              th:text="${report.state + ' ? ' + report.status.label}">
                            ACTIVE
                        </span>
                    </td>
                    <td th:text="${report.confidence + '%'}">80%</td>
                    <td>
                        <form class="moderation-form"
                              th:action="@{/admin/reports/{id}(id=${report.id})}"
                              method="post">
                            <select name="state">
                                <option value="ACTIVE">Keep active</option>
                                <option value="REMOVED">Remove</option>
                            </select>
                            <input type="text" name="reason"
                                   maxlength="300" placeholder="Reason for audit log">
                            <button class="btn btn-dark" type="submit">Save</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
