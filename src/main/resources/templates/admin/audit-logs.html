<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log ? Ase Naki?</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="page-shell">
    <div class="container admin-container">
        <a class="back-link" th:href="@{/admin/reports}">? Back to moderation</a>
        <div class="page-heading">
            <span class="eyebrow eyebrow-dark">Append-only history</span>
            <h1>Moderation audit log</h1>
            <p>These records are never silently deleted by the application.</p>
        </div>

        <div class="empty-state panel" th:if="${#lists.isEmpty(logs)}">
            <span>?</span>
            <h3>No moderation action yet</h3>
        </div>

        <div class="timeline" th:unless="${#lists.isEmpty(logs)}">
            <article class="panel timeline-item" th:each="log : ${logs}">
                <span class="timeline-dot"></span>
                <div>
                    <strong th:text="${log.action}">Action</strong>
                    <p th:text="${log.details}">Details</p>
                    <small th:text="${log.actor.profile.fullName + ' ? ' + log.createdAt}">
                        Admin ? date
                    </small>
                </div>
            </article>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
